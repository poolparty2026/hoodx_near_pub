# Gate 3 spike: can an agent drive token transfers through our contract
# using a function-call access key that cannot attach deposits?
[workspace]
resolver = "2"
members = ["contracts/relay", "contracts/token", "contracts/sink", "contracts/probe", "contracts/btoken", "tests-sandbox"]

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
