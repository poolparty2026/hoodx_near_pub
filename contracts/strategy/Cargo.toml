[package]
name = "strategy"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.95"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
proptest = "1.5"
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[features]
# Sandbox network constants (test token and DCL accounts). Off by default, so a release
# build always carries the mainnet constants; `contract::tests::default_build_is_mainnet`
# checks it.
sandbox = []
